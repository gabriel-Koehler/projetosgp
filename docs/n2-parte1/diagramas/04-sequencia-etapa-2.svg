<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1690" viewBox="0 0 1650 1690" role="img"><title>Sequência — etapa 2: troca de mensagens no sucesso</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#29443a" stroke-width="1.5"/></marker><marker id="filled" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#29443a"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="825.0" y="30" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700" fill="#173b2a">Sequência — etapa 2: troca de mensagens no sucesso</text><circle cx="85" cy="83" r="12" fill="white" stroke="#29443a" stroke-width="2"/><polyline points="85,95 85,135" fill="none" stroke="#29443a" stroke-width="1.6"/><polyline points="61,110 109,110" fill="none" stroke="#29443a" stroke-width="1.6"/><polyline points="85,135 63,165" fill="none" stroke="#29443a" stroke-width="1.6"/><polyline points="85,135 107,165" fill="none" stroke="#29443a" stroke-width="1.6"/><text x="85" y="193" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#173b2a">Professor</text><polyline points="85,175 85,1635" fill="none" stroke="#93ac9c" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="201" y="75" width="182" height="65" rx="0" fill="#f1f7f3" stroke="#29443a" stroke-width="1.6"/><text x="292" y="98" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#173b2a">«boundary»</text><text x="292" y="120" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#173b2a">Interface</text><polyline points="292,175 292,1635" fill="none" stroke="#93ac9c" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="408" y="75" width="182" height="65" rx="0" fill="#f1f7f3" stroke="#29443a" stroke-width="1.6"/><text x="499" y="98" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#173b2a">«control»</text><text x="499" y="120" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#173b2a">API</text><polyline points="499,175 499,1635" fill="none" stroke="#93ac9c" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="615" y="75" width="182" height="65" rx="0" fill="#f1f7f3" stroke="#29443a" stroke-width="1.6"/><text x="706" y="98" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#173b2a">«control»</text><text x="706" y="120" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#173b2a">ServicoCorrecao</text><polyline points="706,175 706,1635" fill="none" stroke="#93ac9c" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="822" y="75" width="182" height="65" rx="0" fill="#f1f7f3" stroke="#29443a" stroke-width="1.6"/><text x="913" y="98" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#173b2a">«control»</text><text x="913" y="120" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#173b2a">OMR</text><polyline points="913,175 913,1635" fill="none" stroke="#93ac9c" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1029" y="75" width="182" height="65" rx="0" fill="#f1f7f3" stroke="#29443a" stroke-width="1.6"/><text x="1120" y="98" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#173b2a">«repository»</text><text x="1120" y="120" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#173b2a">Repositorio</text><polyline points="1120,175 1120,1635" fill="none" stroke="#93ac9c" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1236" y="75" width="182" height="65" rx="0" fill="#f1f7f3" stroke="#29443a" stroke-width="1.6"/><text x="1327" y="98" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#173b2a">«database»</text><text x="1327" y="120" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#173b2a">PostgreSQL</text><polyline points="1327,175 1327,1635" fill="none" stroke="#93ac9c" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1443" y="75" width="182" height="65" rx="0" fill="#f1f7f3" stroke="#29443a" stroke-width="1.6"/><text x="1534" y="98" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#173b2a">«external»</text><text x="1534" y="120" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#173b2a">Supabase Storage</text><polyline points="1534,175 1534,1635" fill="none" stroke="#93ac9c" stroke-width="1.6" stroke-dasharray="7 5"/><polyline points="85,246 292,246" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="188.5" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">1. Selecionar aluno e</text><text x="188.5" y="239" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">enviar imagem</text><polyline points="292,311 499,311" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="395.5" y="285" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">2. POST correção (imagem,</text><text x="395.5" y="304" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">aluno)</text><polyline points="504,350 569,350 569,380 504,380" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="577" y="357" font-family="Arial, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#173b2a">3. Validar sessão e entrada</text><polyline points="499,441 706,441" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="602.5" y="415" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">4. corrigir(professor,</text><text x="602.5" y="434" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">aluno, imagem)</text><polyline points="706,506 913,506" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="809.5" y="480" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">5. Decodificar QR da</text><text x="809.5" y="499" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">imagem</text><polyline points="913,571 706,571" fill="none" stroke="#29443a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="809.5" y="545" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">6. Código da versão ou</text><text x="809.5" y="564" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">falha</text><polyline points="706,636 1120,636" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="913.0" y="610" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">7. Consultar versão e vínculos</text><polyline points="1120,701 1327,701" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1223.5" y="675" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">8. SELECT por código e</text><text x="1223.5" y="694" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">professor</text><polyline points="1327,766 1120,766" fill="none" stroke="#29443a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1223.5" y="740" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">9. Snapshot, gabarito e</text><text x="1223.5" y="759" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">vínculos</text><polyline points="1120,831 706,831" fill="none" stroke="#29443a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="913.0" y="805" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">10. Versão autorizada ou ausência</text><polyline points="706,896 913,896" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="809.5" y="870" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">11. Alinhar e ler</text><text x="809.5" y="889" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">marcações</text><polyline points="913,961 706,961" fill="none" stroke="#29443a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="809.5" y="935" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">12. Respostas, rasuras e</text><text x="809.5" y="954" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">confiança</text><polyline points="711,1000 776,1000 776,1030 711,1030" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="784" y="1007" font-family="Arial, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#173b2a">13. Classificar e calcular</text><text x="784" y="1026" font-family="Arial, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#173b2a">nota</text><polyline points="706,1091 1534,1091" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1120.0" y="1065" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">14. Gravar imagem privada</text><polyline points="1534,1156 706,1156" fill="none" stroke="#29443a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1120.0" y="1130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">15. Caminho da imagem ou falha</text><polyline points="706,1221 1120,1221" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="913.0" y="1195" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">16. Persistir resultado e imagemPath</text><polyline points="1120,1286 1327,1286" fill="none" stroke="#29443a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1223.5" y="1260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">17. BEGIN; INSERT/UPSERT;</text><text x="1223.5" y="1279" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">COMMIT</text><polyline points="1327,1351 1120,1351" fill="none" stroke="#29443a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1223.5" y="1325" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">18. ID confirmado ou erro</text><polyline points="1120,1416 706,1416" fill="none" stroke="#29443a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="913.0" y="1390" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">19. Resultado confirmado ou falha</text><polyline points="706,1481 499,1481" fill="none" stroke="#29443a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="602.5" y="1455" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">20. Resultado confirmado</text><text x="602.5" y="1474" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">+ nota</text><polyline points="499,1546 292,1546" fill="none" stroke="#29443a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="395.5" y="1520" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">21. 201 — resultado salvo</text><polyline points="292,1611 85,1611" fill="none" stroke="#29443a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="188.5" y="1585" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">22. Exibir nota e</text><text x="188.5" y="1604" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#173b2a">confirmação</text><text x="830" y="1670" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400" fill="#173b2a">Linha tracejada: retorno • break: interrompe a tentativa • sucesso só após COMMIT confirmado</text></svg>