# Preparação local N1. Aplicar somente quando a publicação for autorizada.
services:
  - type: web
    name: avaliasystem-n1
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
